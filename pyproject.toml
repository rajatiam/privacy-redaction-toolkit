[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-redaction-toolkit"
version = "1.0.0"
description = "Recursive structured-data redaction with auditable replacement counts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
privacy-redaction-toolkit = "privacy_redaction_toolkit:entrypoint"

[tool.setuptools.packages.find]
include = ["privacy_redaction_toolkit*"]
